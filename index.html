
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairo 4k</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script>
        // Global shim for process.env to prevent ReferenceError in browser
        window.process = window.process || { env: {} };
    </script>
    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            margin: 0;
            overflow: hidden;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.2);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.4);
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* TV Optimization: Focus Rings */
        :focus-visible {
            outline: 3px solid #6366f1 !important;
            outline-offset: 4px;
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.5) !important;
            transform: scale(1.02);
            transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes glow {
          0%, 100% { text-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
          50% { text-shadow: 0 0 40px rgba(99, 102, 241, 0.8), 0 0 10px rgba(255, 255, 255, 0.5); }
        }
        .kairo-glow {
          animation: glow 3s ease-in-out infinite;
        }
    </style>

        "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
        "react-dom/client": "https://esm.sh/react-dom@^19.2.4/client",
        "vite": "https://esm.sh/vite@^7.3.1"
      }
    }
    </script>
</head>

</body>
</html>
