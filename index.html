<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kairo 4K | Autonomous Stream Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=Comfortaa:wght@300..700&family=Righteous&display=swap"
    rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    window.process = window.process || { env: {} };
  </script>
  <style>
    body {
      background-color: #020617;
      color: #f8fafc;
      margin: 0;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* New Aero-Flow Scrollbar */
    ::-webkit-scrollbar {
      width: 4px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(249, 115, 22, 0.2);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(249, 115, 22, 0.5);
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

    /* Fluid Animation Presets */
    @keyframes float {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    .aero-float {
      animation: float 6s ease-in-out infinite;
    }

    @keyframes cyber-glow {

      0%,
      100% {
        filter: drop-shadow(0 0 15px rgba(249, 115, 22, 0.4)) brightness(1);
        text-shadow: 0 0 10px rgba(249, 115, 22, 0.2);
      }

      50% {
        filter: drop-shadow(0 0 30px rgba(249, 115, 22, 0.8)) brightness(1.3);
        text-shadow: 0 0 20px rgba(249, 115, 22, 0.5);
      }
    }

    .kairo-cyber-glow {
      color: #f97316;
      /* Orange 500 */
      font-family: 'Comfortaa', sans-serif;
      animation: cyber-glow 3s ease-in-out infinite;
    }

    @keyframes shimmer {
      0% {
        background-position: -200% 0;
      }

      100% {
        background-position: 200% 0;
      }
    }

    .kairo-shimmer {
      background: linear-gradient(90deg, #f97316 0%, #fff 50%, #f97316 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 5s linear infinite;
    }

    /* Glassmorphism Classes */
    .glass {
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* TV/Desktop Focus States */
    :focus-visible {
      outline: none;
      box-shadow: 0 0 0 4px rgba(249, 115, 22, 0.4);
      background: rgba(249, 115, 22, 0.15) !important;
      transform: scale(1.05);
      transition: all 0.3s cubic-bezier(0.19, 1, 0.22, 1);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="./src/index.tsx"></script>
</body>

</html>
